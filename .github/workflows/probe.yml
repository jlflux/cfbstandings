name: Probe ESPN

# Run by hand to check that ESPN's responses still parse the way the client
# expects - useful after a season rolls over or ESPN changes a payload.
on:
  push:
    branches: ['claude/**']   # TEMP: validating ESPN parsing, removed before merge
  workflow_dispatch:
    inputs:
      season:
        description: 'Season year (blank = current)'
        required: false

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe the endpoints
        env:
          PYTHONPATH: src
        run: |
          python -m cfb ${{ github.event.inputs.season && format('--season {0}', github.event.inputs.season) || '' }} probe
      - name: Build once against live data
        env:
          PYTHONPATH: src
        run: |
          python -m cfb --pause 0.15 build --out site --save-season season.json
          python - <<'PY'
          import json
          d = json.load(open("site/data.json"))
          print(f"week {d['week']}, {len(d['conferences'])} conferences")
          for c in d["conferences"]:
              rows = [r for b in c["blocks"] for r in b["rows"]]
              lead = ", ".join(f"{r['name']} {r['conf_record']}" for r in rows[:3])
              print(f"  {c['name']:<34} {len(rows):>2} teams | {lead}")
              for n in c["notes"][:4]:
                  mark = "  ok " if n["resolved"] else "  ?? "
                  print(f"{mark}{', '.join(n['tied'])} @ {n['at_record']}: {n['summary'][:90]}")
          PY
      - name: Commit the live snapshot for review   # TEMP, with the push trigger
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          mkdir -p data
          cp season.json data/latest.json
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/latest.json
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "Live ESPN snapshot for review"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: probe-output
          path: |
            site/data.json
            season.json
          retention-days: 7
